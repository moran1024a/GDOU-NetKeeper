[package]
name = "gdou-netkeeper"
version = "0.3.2"
edition = "2021"
description = "Minimal Linux SRUN campus network authentication service"
license = "MIT"

[[bin]]
name = "netkeeper"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
hmac = "0.12"
md-5 = "0.10"
nix = { version = "0.30", features = ["net", "user"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
socket2 = { version = "0.6", features = ["all"] }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt", "signal", "time", "net", "io-util", "process"] }
toml = "0.8"
unicode-width = "0.2"

[profile.release]
strip = true
lto = "thin"
